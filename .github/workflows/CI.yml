name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # The ecosystem requires Julia >= 1.12.
          - '1.12'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        arch:
          - x64
        exclude:
          - version: 'nightly'
            os: macos-latest
          - version: 'nightly'
            os: windows-latest
    steps:
      # The fifteen packages are independent repositories that find each other
      # through [sources] path dependencies (`Networks = {path = "../Networks.jl"}`).
      # A lone checkout has no siblings, so those paths dangle and Pkg fails to
      # resolve before a single test runs. Rebuild the layout every developer has
      # locally: this package in a directory named after it, siblings beside it.
      - uses: actions/checkout@v4
        with:
          path: ERGMUserterms.jl

      # The clone list is DERIVED from Project.toml's [sources] (panel 2026-09,
      # item 29), never hand-written, so it cannot drift from the dependencies
      # again; test/runtests.jl ("CI clone lists are derived from [sources]")
      # runs this very pipeline and pins that it yields the [sources] keys.
      # `--depth 1` of `main` is the pre-release arrangement: once 0.2.0 is
      # tagged and registered (item 21) the clones give way to registry
      # versions pinned by [compat].
      - name: Reconstruct the ecosystem layout
        shell: bash
        run: |
          org=https://github.com/statistical-network-analysis-with-Julia
          for pkg in $(sed -n '/^\[sources\]/,/^\[/p' ERGMUserterms.jl/Project.toml | grep -oE '^[A-Za-z]+'); do
            git clone --depth 1 --quiet "$org/$pkg.jl" "$pkg.jl"
          done

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      # No JULIA_NUM_THREADS cell: this package spawns no tasks (the harness
      # draws every dyad from the caller's rng on the calling thread), so
      # thread-count independence is trivially true and there is nothing a
      # multi-threaded cell would exercise.
      - name: Run tests
        shell: bash
        working-directory: ERGMUserterms.jl
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      # The allocation-regression gates (panel 2026-09, item 7): the
      # standalone benchmark environment must instantiate from the committed
      # metadata (`benchmark/Project.toml` [sources] point at `..` and the
      # siblings `../../ERGM.jl`, `../../Networks.jl` cloned above) and the
      # per-dyad pins on the bundled terms must hold. `Pkg.test()` guards the
      # same pins (testset "Allocation regressions"); this step proves the
      # benchmark harness the site's tools/run_benchmarks.jl consumes runs.
      - name: Run allocation-regression gates
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: ERGMUserterms.jl
        run: |
          julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
          julia --project=benchmark benchmark/regression_tests.jl

      # The copyable third-party skeleton in examples/MyTermPackage is
      # `include`d by the test suite above, but its OWN environment (its
      # Project.toml [sources]/[compat] and test target) is what a term author
      # copies, so it is instantiated and tested as a package here too.
      - name: Template package tests
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: ERGMUserterms.jl
        run: julia --project=examples/MyTermPackage -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          directories: ERGMUserterms.jl/src

      - uses: codecov/codecov-action@v4
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
