[deps]
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
ERGM = "d623cd87-b018-4e2a-bf53-b77ebcdc9da2"
ERGMUserterms = "fb82099d-cb11-4d76-9fd7-dea636fffb01"
Graphs = "86223c79-3864-5bf0-83f7-82e725a168b6"
Networks = "027a387e-e55f-4537-a155-5037e5a23bdb"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

# Paths are relative to THIS directory (benchmark/), so the siblings are two
# levels up — `../Networks.jl` would be ERGMUserterms.jl/Networks.jl, which
# does not exist (the off-by-one the 2026-09 panel found in six benchmark
# environments, item 7). `julia --project=benchmark -e 'using Pkg;
# Pkg.instantiate()'` from the package root verifies these resolve.
[sources]
ERGMUserterms = {path = ".."}
ERGM = {path = "../../ERGM.jl"}
Networks = {path = "../../Networks.jl"}

[compat]
BenchmarkTools = "1"
Graphs = "1.9"
julia = "1.12"
